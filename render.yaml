# Render Blueprint – optional. You can also create the service by hand (see DEPLOYMENT.md).
services:
  - type: web
    name: quiz-platform-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    # Free plan sleeps after 15 min idle. The app pings its own RENDER_EXTERNAL_URL every 10 min to stay awake
    # (set KEEP_ALIVE=false on a paid plan). Add an UptimeRobot monitor on /api/health as a backup.
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND            # the frontend lives on Vercel
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE           # Vercel proxies /api, so the cookie is first-party
        value: lax
      - key: PUBLIC_RATE_MAX_PER_MIN   # all students arrive via Vercel's proxy IPs
        value: "30000"
      - key: START_RATE_MAX_PER_10MIN
        value: "5000"
      - key: MONGODB_URI               # paste your Atlas connection string in the dashboard
        sync: false
      - key: MONGODB_DB
        value: quizplatform
      - key: ADMIN_USERNAME            # used only on first start when no admin exists
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
